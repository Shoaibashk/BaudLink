# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  # CLI binary (cross-platform)
  - id: cli
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Shoaibashk/BaudLink/cmd.version={{.Version}}
      - -X github.com/Shoaibashk/BaudLink/cmd.commit={{.Commit}}
      - -X github.com/Shoaibashk/BaudLink/cmd.date={{.Date}}
    binary: baudlink

  # Windows tray app (GUI - no console window)
  - id: tray-windows
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -H=windowsgui
      - -X github.com/Shoaibashk/BaudLink/cmd.version={{.Version}}
      - -X github.com/Shoaibashk/BaudLink/cmd.commit={{.Commit}}
      - -X github.com/Shoaibashk/BaudLink/cmd.date={{.Date}}
    binary: baudlink-tray

archives:
  - id: windows
    ids:
      - cli
      - tray-windows
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - zip
    files:
      - README.md
      - LICENSE
      - INSTALL.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: Shoaibashk
    name: BaudLink
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}}-v{{.Version}}"
  extra_files:
    - glob: ./dist/*.zip

